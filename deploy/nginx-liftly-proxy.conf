# /etc/nginx/liftly-proxy.conf — shared proxy headers for the Liftly locations.
proxy_set_header Host $host;
# Overwrite (not append) X-Forwarded-For: the server rate-limits by it, so clients mustn't set it.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 30s;
