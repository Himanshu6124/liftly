# /etc/nginx/sites-available/liftly — reverse proxy for the Liftly API. LIFTLY_DOMAIN is replaced
# at install time. certbot --nginx then adds the HTTPS listener and the HTTP→HTTPS redirect.
limit_req_zone $binary_remote_addr zone=liftly_auth:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name LIFTLY_DOMAIN;

    # Sync batches are at most 500 rows of a few hundred bytes.
    client_max_body_size 2m;

    location /auth/ {
        limit_req zone=liftly_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/liftly-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/liftly-proxy.conf;
    }
}
