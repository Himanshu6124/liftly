# /etc/postgresql/16/main/conf.d/liftly-small.conf — PostgreSQL sized for a 1 GB VM shared with
# other apps. Liftly needs a handful of connections and little cache.
listen_addresses = 'localhost'
max_connections = 20
shared_buffers = 32MB
effective_cache_size = 128MB
work_mem = 2MB
maintenance_work_mem = 16MB
wal_buffers = 1MB
